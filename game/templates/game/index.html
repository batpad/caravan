{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16224a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Caravan Road</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'game/style.css' %}">
</head>
<body>
  <header class="topbar" id="topbar" data-tour="topbar">
    <a class="brand" href="/" aria-label="Caravan Road — home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 2l4.2 7.8L32.7 7.3l-2.5 8.5L38 20l-7.8 4.2 2.5 8.5-8.5-2.5L20 38l-4.2-7.8-8.5 2.5 2.5-8.5L2 20l7.8-4.2-2.5-8.5 8.5 2.5Z" fill="#e3b23c" stroke="#5c3d0c" stroke-width="1.2"/>
        <circle cx="20" cy="20" r="9.5" fill="#16224a" stroke="#5c3d0c"/>
        <use href="#ic-caravan" x="12.5" y="12.5" width="15" height="15" style="color:#f3dfa2"/>
      </svg>
      <span>Caravan Road</span>
    </a>
    <div id="topbar-status" data-tour="topbar-status"></div>
  </header>
  <main id="app"></main>
  <div id="overlay-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="{% static 'game/app.js' %}"></script>
</body>
</html>
